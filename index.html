  amb.intensity+=(AMB[stg]-amb.intensity)*.05;DL.intensity+=((mode==="s6"?.3:mode==="s7"?.6:mode==="s3"?.5:.85)-DL.intensity)*.05;
}
function animate(){
  var air=jt>=0||fy>.5,jy=air?Math.sin(Math.PI*jt)*2.3:0,dead=st==="dead"||lying,idle=st==="menu"&&!lying,run=(st!=="play"||sl>=0||dead)?0:Math.sin(t*14)*(air?.3:1);

  Pl.wL.rotation.z=-(.35+Math.sin(t*18)*.45);Pl.wR.rotation.z=.35+Math.sin(t*18)*.45;

  Pl.cape.visible=cloakT>0;Pl.capeSw.rotation.x=Math.sin(t*9)*.08+(st==="play"?.12:0);Pl.root.visible=!(cloakT>0&&cloakT<1.2&&Math.floor(t*10)%2===1);
  var k=Math.max(.4,1-(jy+fy)/4);Pl.shadow.position.x=px*LANE;Pl.shadow.scale.set(k,k,k);

<script type="module">

const firebaseConfig={apiKey:"AIzaSyCX3g7SFlEoTUmVQxv7HOkjOQMXfQ3rSGE",authDomain:"test-1-fbaf8.firebaseapp.com",projectId:"test-1-fbaf8",appId:"1:723355751794:web:9114d0ba03db54b2a339eb"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),fs=getFirestore(app);

async function refresh(){
  $("lb").textContent="بتحمّل...";
  try{
    const s=await getDocs(query(collection(fs,"runnerScores"),orderBy("best","desc"),limit(10)));
    if(s.empty){$("lb").textContent="لسه مفيش نتايج. كن أول واحد!";return}
    let h="",i=0;
    s.forEach(d=>{const r=d.data();i++;h+="<div><span>"+i+". "+esc(r.name||"لاعب")+"</span><span>"+esc(r.best)+"</span></div>"});

  }catch(e){

    $("lb").innerHTML=(c==="permission-denied"?"قواعد Firebase مش منشورة صح (permission-denied).":"تعذّر تحميل اللوحة ("+esc(c||"خطأ")+"). اتأكد من الإنترنت.")+'<br><button class="btn sm" id="lbr" type="button">إعادة المحاولة</button>';
    $("lbr").onclick=refresh;
  }
}

  try{
    const u=auth.currentUser;if(!u||s<=0)return;
    const ref=doc(fs,"runnerScores",u.uid),snap=await getDoc(ref);
    const old=snap.exists()?snap.data().best:0;
    if(s>old){await setDoc(ref,{name:(u.displayName||"لاعب").split(" ")[0].slice(0,20),best:s,at:Date.now()});refresh()}

};
