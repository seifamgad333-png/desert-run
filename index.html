<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

var cv=$("c"),W=innerWidth,H=innerHeight,R=null,scene,cam,amb;
var LANE=2.2;

try{best=+localStorage.getItem("dr_best")||0;mute=localStorage.getItem("dr_mute")==="1"}catch(e){}
var SK=[["#5bb3e6","#fde4b8"],["#f39c4a","#fde0a8"],["#7b5ea7","#f7b2a0"],["#12214a","#4a4a8a"],["#4aa8e0","#dff1ee"],["#e0793c","#f8d28a"]];

function lv(){return 1+Math.floor(score/250)}
/* الصوت */
var AC=null;
function au(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==="suspended")AC.resume()}
function tone(f1,f2,d,ty,vol){
  if(mute||!AC)return;
  var o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;
  o.type=ty;o.frequency.setValueAtTime(f1,n);o.frequency.exponentialRampToValueAtTime(f2,n+d);
  g.gain.setValueAtTime(vol,n);g.gain.exponentialRampToValueAtTime(.001,n+d);
  o.connect(g);g.connect(AC.destination);o.start();o.stop(n+d);
}
var SFX={
  jump:function(){tone(380,760,.14,"square",.07)},
  slide:function(){tone(320,120,.2,"triangle",.12)},
  move:function(){tone(520,470,.05,"sine",.07)},
  hit:function(){tone(220,40,.45,"sawtooth",.16)},
  mile:function(){tone(660,990,.12,"square",.06);setTimeout(function(){tone(990,1320,.15,"square",.06)},110)}
};
function sndIcon(){$("snd").textContent=mute?"🔇":"🔊"}
$("snd").onclick=function(e){e.stopPropagation();mute=!mute;try{localStorage.setItem("dr_mute",mute?"1":"0")}catch(er){}sndIcon();au()};
sndIcon();

/* التحكم */
function go(d){if(st!=="play")return;var n=Math.max(-1,Math.min(1,lane+d));if(n!==lane){lane=n;SFX.move()}}
function jump(){if(st!=="play")return;if(jt>=0){buf="j";bufT=.18;return}sl=-1;jt=0;SFX.jump()}
function slide(){if(st!=="play")return;if(sl>=0){buf="s";bufT=.18;return}jt=-1;sl=0;SFX.slide()}
var sx=0,sy=0,lastAct=0,buf=null,bufT=0;
cv.addEventListener("touchstart",function(e){var p=e.touches[0];sx=p.clientX;sy=p.clientY},{passive:true});
cv.addEventListener("touchmove",function(e){
  e.preventDefault();
  if(st!=="play")return;
  var p=e.touches[0],dx=p.clientX-sx,dy=p.clientY-sy,n=Date.now();
  if(Math.abs(dx)<18&&Math.abs(dy)<18)return;
  if(n-lastAct<110)return;
  lastAct=n;sx=p.clientX;sy=p.clientY;
  if(Math.abs(dx)>Math.abs(dy))go(dx>0?1:-1);else if(dy<0)jump();else slide();
},{passive:false});
document.addEventListener("keydown",function(e){
  var k=e.key;
  if(k==="ArrowLeft")go(-1);else if(k==="ArrowRight")go(1);
  else if(k==="ArrowUp"||k===" ")jump();else if(k==="ArrowDown")slide();
  else if(k==="Enter"&&st!=="play"&&!$("ov").hidden&&!$("m-main").hidden)start("endless");
});



/* ===== 3D ===== */
var T={},M={},G={},Pl={},pool={},Wd={},cur=null,mode="endless",s1done=false,WIN=2000;
try{s1done=localStorage.getItem("dr_s1")==="1"}catch(e){}
var skyX,skyT,curA,curB,tgtA,tgtB,stageNow=-1;
SFX.win=function(){[523,659,784,1047].forEach(function(f,i){setTimeout(function(){tone(f,f*1.01,.25,"square",.07)},i*160)})};
function mkTex(w,h,fn,rx,ry){
  var c=document.createElement("canvas");c.width=w;c.height=h;fn(c.getContext("2d"),w,h);
  var tx=new THREE.CanvasTexture(c);tx.wrapS=tx.wrapT=THREE.RepeatWrapping;tx.repeat.set(rx,ry);return tx;
}
function sandFn(g,w,h){
  g.fillStyle="#e3bf84";g.fillRect(0,0,w,h);
  for(var i=0;i<700;i++){g.fillStyle=i%2?"rgba(255,240,200,.35)":"rgba(120,80,30,.25)";g.fillRect(Math.random()*w,Math.random()*h,1+Math.random()*2,1)}
  g.strokeStyle="rgba(140,100,50,.16)";
  for(i=0;i<6;i++){var y=Math.random()*h;g.beginPath();g.moveTo(0,y);g.bezierCurveTo(w*.3,y+6,w*.6,y-6,w,y);g.stroke()}
}
function trackFn(g,w,h){
  for(var ln=0;ln<3;ln++)for(var r=0;r<2;r++){g.fillStyle=(ln+r)%2?"#dbb277":"#d0a35f";g.fillRect(ln*64,r*64,64,64)}
  g.strokeStyle="rgba(90,55,20,.55)";g.lineWidth=2;
  for(ln=0;ln<3;ln++)for(r=0;r<2;r++)g.strokeRect(ln*64+1,r*64+1,62,62);
  for(var i=0;i<160;i++){g.fillStyle="rgba(90,55,20,.18)";g.fillRect(Math.random()*w,Math.random()*h,2,1)}
}
function brickFn(g,w,h){
  g.fillStyle="#b9915a";g.fillRect(0,0,w,h);g.strokeStyle="rgba(50,25,5,.5)";g.lineWidth=3;
  for(var i=0;i<4;i++){g.beginPath();g.moveTo(0,i*32);g.lineTo(w,i*32);g.stroke();var o=i%2?32:64;g.beginPath();g.moveTo(o,i*32);g.lineTo(o,i*32+32);g.stroke();g.beginPath();g.moveTo(o+64,i*32);g.lineTo(o+64,i*32+32);g.stroke()}
  g.fillStyle="rgba(50,25,5,.5)";g.fillRect(56,14,16,8);g.fillRect(60,26,8,10);g.fillRect(52,40,24,5);
}
function stripeFn(g,w,h){g.fillStyle="#6b4423";g.fillRect(0,0,w,h);g.fillStyle="#e8b83a";for(var i=0;i<4;i++)g.fillRect(i*16+2,0,8,h)}
function waterFn(g,w,h){g.fillStyle="#2f8fb8";g.fillRect(0,0,w,h);g.strokeStyle="rgba(255,255,255,.28)";g.lineWidth=2;for(var i=0;i<16;i++){var y=Math.random()*h,x=Math.random()*w;g.beginPath();g.moveTo(x,y);g.bezierCurveTo(x+15,y-4,x+30,y+4,x+45,y);g.stroke()}}
function grassFn(g,w,h){g.fillStyle="#7a9a4a";g.fillRect(0,0,w,h);for(var i=0;i<500;i++){g.fillStyle=i%3?"rgba(60,100,30,.35)":"rgba(210,200,120,.3)";g.fillRect(Math.random()*w,Math.random()*h,2,1+Math.random()*2)}}
function paveFn(g,w,h){g.fillStyle="#b89868";g.fillRect(0,0,w,h);g.strokeStyle="rgba(60,40,15,.5)";g.lineWidth=2;for(var r=0;r<4;r++){var o=r%2?32:0;g.beginPath();g.moveTo(0,r*32);g.lineTo(w,r*32);g.stroke();for(var c=0;c<3;c++){g.beginPath();g.moveTo(o+c*64,r*32);g.lineTo(o+c*64,r*32+32);g.stroke()}}for(var i=0;i<150;i++){g.fillStyle="rgba(60,40,15,.15)";g.fillRect(Math.random()*w,Math.random()*h,2,1)}}
function bldgFn(g,w,h){g.fillStyle="#cfa46c";g.fillRect(0,0,w,h);g.fillStyle="rgba(80,50,20,.25)";for(var i=0;i<30;i++)g.fillRect(Math.random()*w,Math.random()*h,8,2);g.fillStyle="#3a2a1a";g.fillRect(16,28,18,26);g.fillRect(w-34,28,18,26);g.fillRect(w/2-14,h-44,28,44);g.fillStyle="#9c7440";g.fillRect(0,0,w,10)}
function crateFn(g,w,h){g.fillStyle="#9a6a38";g.fillRect(0,0,w,h);g.strokeStyle="#5a3a18";g.lineWidth=6;g.strokeRect(3,3,w-6,h-6);g.beginPath();g.moveTo(0,0);g.lineTo(w,h);g.moveTo(w,0);g.lineTo(0,h);g.stroke()}
function near(a,b){return Math.abs(a.r-b.r)+Math.abs(a.g-b.g)+Math.abs(a.b-b.b)<.02}
function paintSky(){
  var g=skyX.createLinearGradient(0,0,0,256);
  g.addColorStop(0,"#"+curA.getHexString());g.addColorStop(.42,"#"+curB.getHexString());g.addColorStop(1,"#"+curB.getHexString());
  skyX.fillStyle=g;skyX.fillRect(0,0,2,256);skyT.needsUpdate=true;
  if(scene.fog)scene.fog.color.copy(curB);
}
function mat(c){return new THREE.MeshLambertMaterial({color:c})}
function mesh(g,m,sx,sy,sz,x,y,z){var o=new THREE.Mesh(g,m);o.scale.set(sx,sy,sz);o.position.set(x,y,z);return o}
function initGeom(){
  T.brick=mkTex(128,128,brickFn,1,1);T.stripe=mkTex(64,32,stripeFn,1,1);T.crate=mkTex(64,64,crateFn,1,1);T.bldg=mkTex(128,128,bldgFn,1,1);
  G.box=new THREE.BoxGeometry(1,1,1);G.cyl=new THREE.CylinderGeometry(1,1,1,6);G.ico=new THREE.IcosahedronGeometry(1,0);
  G.obel=new THREE.CylinderGeometry(.15,.55,7,4);G.tip=new THREE.ConeGeometry(.2,.7,4);G.hroof=new THREE.ConeGeometry(1.9,1.2,6);G.flame=new THREE.ConeGeometry(.28,.7,5);
  G.shadow=new THREE.CircleGeometry(.6,12).rotateX(-Math.PI/2);G.oshadow=new THREE.PlaneGeometry(2.3,1.7).rotateX(-Math.PI/2);
  M.sandsd=mat(0xd9a863);M.wall=new THREE.MeshLambertMaterial({map:T.brick});M.low=mat(0xc4975c);M.post=mat(0x6b4423);
  M.bar=new THREE.MeshLambertMaterial({map:T.stripe});M.curb=mat(0xb3814a);M.cact=mat(0x4f8a3c);M.trunk=mat(0x6b4a2a);M.palm=mat(0x3f8a3a);
  M.col=mat(0xd9b574);M.rock=mat(0xa98048);M.obel=mat(0xc9a063);M.dune=mat(0xe2bd86);M.mud=mat(0x8a6b45);M.hroof=mat(0x6b4a2a);M.reed=mat(0x5a8a3a);
  M.croc=mat(0x4f7a3a);M.crocd=mat(0x2d4a22);M.eye=mat(0xf0e060);M.crate=new THREE.MeshLambertMaterial({map:T.crate});

}
function newWorld(){var g=new THREE.Group();scene.add(g);return{g:g,decs:[],scrolls:[]}}
function gplane(w,wd,x,y,fn,unit,size){
  var tx=mkTex(size||256,size||256,fn,wd/unit,260/unit);
  var p=new THREE.Mesh(new THREE.PlaneGeometry(wd,260).rotateX(-Math.PI/2),new THREE.MeshLambertMaterial({map:tx}));
  p.position.set(x,y,-90);w.g.add(p);w.scrolls.push([tx,unit]);
}
function track(w){
  var tx=mkTex(192,128,trackFn,1,260/4.4);
  var p=new THREE.Mesh(new THREE.PlaneGeometry(6.6,260).rotateX(-Math.PI/2),new THREE.MeshLambertMaterial({map:tx}));
  p.position.set(0,.02,-90);w.g.add(p);w.scrolls.push([tx,4.4]);
  [-1,1].forEach(function(s){w.g.add(mesh(G.box,M.curb,.35,.25,260,s*3.45,.12,-90))});
}
function far(w){
  [[-35,-150,55,60],[40,-135,40,42],[105,-155,30,30],[-95,-140,25,26]].forEach(function(p){
    var py=new THREE.Mesh(new THREE.ConeGeometry(p[2],p[3],4),M.sandsd);py.rotation.y=Math.PI/4;py.position.set(p[0],p[3]/2,p[1]);w.g.add(py);
  });
  [[-70,-95],[75,-100],[0,-170]].forEach(function(p){w.g.add(mesh(G.ico,M.dune,45,6,28,p[0],0,p[1]))});
  var sun=new THREE.Mesh(new THREE.SphereGeometry(9,8,6),new THREE.MeshBasicMaterial({color:0xfff3b0,fog:false}));sun.position.set(45,52,-200);w.g.add(sun);
}
function place(d){d.side=d.sm||(Math.random()<.5?-1:1);d.off=d.lo+Math.random()*(d.hi-d.lo);d.g.position.x=d.side*d.off}
function addDecs(w,specs){
  specs.forEach(function(sp){
    for(var i=0;i<sp[1];i++){
      var d={g:sp[0](),sm:sp[2],lo:sp[3],hi:sp[4],z:-110+i*(122/sp[1])+Math.random()*3};
      place(d);d.g.position.z=d.z;w.g.add(d.g);w.decs.push(d);
    }
  });
}
function makeDec(k){
  var g=new THREE.Group();
  if(k===0){
    g.add(mesh(G.cyl,M.cact,.35,3,.35,0,1.5,0));g.add(mesh(G.cyl,M.cact,.18,1.1,.18,-.55,1.7,0));g.add(mesh(G.box,M.cact,.6,.18,.18,-.3,1.15,0));
    g.add(mesh(G.cyl,M.cact,.18,1,.18,.55,2,0));g.add(mesh(G.box,M.cact,.6,.18,.18,.3,1.45,0));
  }else if(k===1){
    g.add(mesh(G.cyl,M.trunk,.22,5,.22,0,2.5,0));g.add(mesh(G.ico,M.palm,1.9,.4,1.9,0,5.1,0));g.add(mesh(G.ico,M.palm,1.2,.35,1.2,.3,5.4,.2));
  }else if(k===2){
    g.add(mesh(G.cyl,M.col,.6,5,.6,0,2.5,0));g.add(mesh(G.box,M.col,1.6,.4,1.6,0,5.2,0));g.add(mesh(G.box,M.col,1.5,.35,1.5,0,.17,0));
  }else if(k===3){
    g.add(mesh(G.ico,M.rock,1.3,.85,1.1,0,.4,0));g.add(mesh(G.ico,M.rock,.7,.5,.6,1.2,.25,.3));
  }else{
    var o=new THREE.Mesh(G.obel,M.obel);o.position.y=3.5;g.add(o);var tp=new THREE.Mesh(G.tip,M.obel);tp.position.y=7.3;g.add(tp);

function mkReed(){var g=new THREE.Group();for(var i=0;i<6;i++){var h=1.6+Math.random()*1.2;g.add(mesh(G.cyl,M.reed,.05,h,.05,(Math.random()-.5)*.8,h/2,(Math.random()-.5)*.8))}return g}
function mkHut(){var g=new THREE.Group();g.add(mesh(G.box,M.mud,2.4,1.7,2.4,0,.85,0));g.add(mesh(G.hroof,M.hroof,1,1,1,0,2.3,0));return g}
function mkCroc(){
  var g=new THREE.Group();
  g.add(mesh(G.box,M.croc,1.2,.4,.75,0,.32,0));g.add(mesh(G.box,M.croc,.6,.28,.45,.85,.27,0));g.add(mesh(G.box,M.croc,.55,.22,.35,-.8,.22,0));
  for(var i=0;i<4;i++)g.add(mesh(G.box,M.crocd,.12,.12,.14,-.4+i*.27,.58,0));
  [[.35,.28],[.35,-.28],[-.3,.28],[-.3,-.28]].forEach(function(p){g.add(mesh(G.box,M.crocd,.14,.18,.14,p[0],.09,p[1]))});
  g.add(mesh(G.box,M.eye,.1,.1,.1,.95,.46,.14));g.add(mesh(G.box,M.eye,.1,.1,.1,.95,.46,-.14));
  g.add(mesh(G.oshadow,M.sh,.9,1,.7,-.3,.03,0));

function mkBldg(){var h=4+Math.random()*5,wd=4+Math.random()*1.2,dp=5+Math.random()*1.5,g=new THREE.Group();g.add(mesh(G.box,M.bldg,wd,h,dp,0,h/2,0));g.add(mesh(G.box,M.bldgTop,wd+.3,.35,dp+.3,0,h+.17,0));return g}
function mkSphinx(){

/* ===== منطق اللعبة ===== */
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function spawn(){
  var L=lv(),ls=[-1,0,1],r=Math.random(),row=[];
  if(L>=2&&r<Math.min(.4,.08*L)){
    var types=["w","l","b"];ls.forEach(function(l){row.push({l:l,t:pick(types)})});
    if(row.every(function(c){return c.t==="w"}))row[Math.floor(Math.random()*3)].t="l";
  }else{
    var q=Math.random(),pw=.35+Math.min(.2,.03*L),ty,lanes;
    if(q<pw)ty="w";else if(q<pw+(1-pw)/2)ty="l";else ty="b";
    if(ty==="w"){lanes=ls.filter(function(){return Math.random()<.5+.05*Math.min(L,4)});if(!lanes.length)lanes=[pick(ls)];if(lanes.length===3)lanes.pop()}
    else lanes=Math.random()<.5?ls.slice():[pick(ls)];
    lanes.forEach(function(l){row.push({l:l,t:ty})});
  }
  var z=-105;
  row.forEach(function(c){var o=getO(c.t);c.m=o[0];c.k=o[1];c.m.position.set(c.l*LANE,0,z)});
  obs.push({c:row,z:z,pz:z});
}
function start(m){
  if(!R)return;
  au();obs.forEach(freeRow);obs=[];setWorld(m);
  st="play";t=0;dist=0;v=14;lane=0;px=0;jt=-1;sl=-1;buf=null;gap=40;score=0;level=1;banner=0;shake=0;lastScore=-1;lastLevel=0;
  $("ov").hidden=true;$("hud").hidden=false;$("bn").style.opacity="0";
  $("hl").textContent=m==="endless"?"المستوى 1":(m==="s1"?"Stage one":"Stage two")+" · 0/"+WIN;
}
function die(o,q){
  var hh=q.t==="b"?.2:(q.t==="l"&&mode==="s1"?.4:.6);
  o.z=o.pz=-.2-hh-.02;for(var j=0;j<o.c.length;j++)o.c[j].m.position.z=o.z;
  jt=-1;sl=-1;deadT=0;
  st="dead";SFX.hit();shake=1;try{if(navigator.vibrate)navigator.vibrate(90)}catch(e){}

    screen("over");$("b-again").textContent="العب تاني";$("b-next").hidden=true;
    $("lbbox").hidden=!le;$("how").hidden=true;
    if(le&&window.lbRefresh)window.lbRefresh();

}
function win(){

function update(dt){

      for(j=0;j<o.c.length;j++){
        var q=o.c[j];

  }

  if(!near(curA,tgtA)||!near(curB,tgtB)){curA.lerp(tgtA,.04);curB.lerp(tgtB,.04);if(near(curA,tgtA)&&near(curB,tgtB)){curA.copy(tgtA);curB.copy(tgtB)}paintSky()}
  amb.intensity+=(AMB[stg]-amb.intensity)*.05;
}
function animate(){

  Pl.root.scale.set(sl>=0?1.1:1,sl>=0?.55:1,sl>=0?1.1:1);
  Pl.root.rotation.z=-(lane-px)*.3;
  Pl.legL.rotation.x=run*.9;Pl.legR.rotation.x=-run*.9;Pl.armL.rotation.x=-run*.8;Pl.armR.rotation.x=run*.8;
  var k=Math.max(.4,1-jy/4);Pl.shadow.position.x=px*LANE;Pl.shadow.scale.set(k,k,k);

}
function loop(ts){

}else{

  $("b-end").disabled=true;$("b-stg").disabled=true;
}
if("serviceWorker" in navigator)addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
setTimeout(function(){if(!window.lbRefresh){var l=$("lb");if(l)l.textContent="تعذّر تحميل Firebase. اتأكد من الإنترنت وحدّث الصفحة."}},8000);
</script>
