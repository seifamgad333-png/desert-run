<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<style>

canvas{display:block;width:100%;height:100%;touch-action:none}

.card{background:rgba(255,248,235,.97);color:#3b2a14;border-radius:20px;padding:18px;width:100%;max-width:360px;max-height:94svh;overflow:auto;text-align:center}

:focus-visible{outline:3px solid #c0392b;outline-offset:2px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" hidden><b id="hs">0</b><span id="hl">المستوى 1</span></div>
<div id="bn"></div>
<button id="snd" type="button" aria-label="الصوت">🔊</button>
<div class="ov" id="ov">
  <div class="card">
    <h1 id="ot" dir="ltr">Desert Run 🏜️</h1>
    <div class="sc" id="os"></div>
    <div class="bt" id="ob"></div>
    <button class="btn" id="pl" type="button">ابدأ</button>
    <div class="how">اسحب يمين/شمال للتبديل بين المسارات، لفوق للقفز، ولتحت للانزلاق. كل ما تتقدم الجري بيسرع والعوائق بتصعب.</div>
    <h2>🏆 لوحة المتصدرين</h2>
    <div class="lb" id="lb">محتاجة إنترنت.</div>
    <div id="acc"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
var cv=$("c"),W=innerWidth,H=innerHeight,R=null,scene,cam,amb;
var LANE=2.2;
var st="menu",t=0,dist=0,v=14,lane=0,px=0,jt=-1,sl=-1,obs=[],decs=[],gap=30,shake=0,score=0,best=0,level=1,banner=0,mute=false,lastTs=0,LOW=false,ema=.016,lastScore=-1,lastLevel=0;
try{best=+localStorage.getItem("dr_best")||0;mute=localStorage.getItem("dr_mute")==="1"}catch(e){}
var SK=[["#5bb3e6","#fde4b8"],["#f39c4a","#fde0a8"],["#7b5ea7","#f7b2a0"],["#12214a","#4a4a8a"]];
var AMB=[.72,.66,.55,.42];
function lv(){return 1+Math.floor(score/250)}
/* الصوت */
var AC=null;
function au(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==="suspended")AC.resume()}
function tone(f1,f2,d,ty,vol){
  if(mute||!AC)return;
  var o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;
  o.type=ty;o.frequency.setValueAtTime(f1,n);o.frequency.exponentialRampToValueAtTime(f2,n+d);
  g.gain.setValueAtTime(vol,n);g.gain.exponentialRampToValueAtTime(.001,n+d);
  o.connect(g);g.connect(AC.destination);o.start();o.stop(n+d);
}
var SFX={
  jump:function(){tone(380,760,.14,"square",.07)},
  slide:function(){tone(320,120,.2,"triangle",.12)},
  move:function(){tone(520,470,.05,"sine",.07)},
  hit:function(){tone(220,40,.45,"sawtooth",.16)},
  mile:function(){tone(660,990,.12,"square",.06);setTimeout(function(){tone(990,1320,.15,"square",.06)},110)}
};
function sndIcon(){$("snd").textContent=mute?"🔇":"🔊"}
$("snd").onclick=function(e){e.stopPropagation();mute=!mute;try{localStorage.setItem("dr_mute",mute?"1":"0")}catch(er){}sndIcon();au()};
sndIcon();

/* التحكم */
function go(d){if(st!=="play")return;var n=Math.max(-1,Math.min(1,lane+d));if(n!==lane){lane=n;SFX.move()}}
function jump(){if(st!=="play")return;if(jt>=0){buf="j";bufT=.18;return}sl=-1;jt=0;SFX.jump()}
function slide(){if(st!=="play")return;if(sl>=0){buf="s";bufT=.18;return}jt=-1;sl=0;SFX.slide()}
var sx=0,sy=0,lastAct=0,buf=null,bufT=0;
cv.addEventListener("touchstart",function(e){var p=e.touches[0];sx=p.clientX;sy=p.clientY},{passive:true});
cv.addEventListener("touchmove",function(e){
  e.preventDefault();
  if(st!=="play")return;
  var p=e.touches[0],dx=p.clientX-sx,dy=p.clientY-sy,n=Date.now();
  if(Math.abs(dx)<18&&Math.abs(dy)<18)return;
  if(n-lastAct<110)return;
  lastAct=n;sx=p.clientX;sy=p.clientY;
  if(Math.abs(dx)>Math.abs(dy))go(dx>0?1:-1);else if(dy<0)jump();else slide();
},{passive:false});
document.addEventListener("keydown",function(e){
  var k=e.key;
  if(k==="ArrowLeft")go(-1);else if(k==="ArrowRight")go(1);
  else if(k==="ArrowUp"||k===" ")jump();else if(k==="ArrowDown")slide();
  else if(k==="Enter"&&st!=="play")start();
});


/* ===== 3D ===== */
var T={},M={},G={},Pl={},pool={w:[],l:[],b:[]};
var skyX,skyT,curA,curB,tgtA,tgtB,stageNow=-1;
function mkTex(w,h,fn,rx,ry){
  var c=document.createElement("canvas");c.width=w;c.height=h;fn(c.getContext("2d"),w,h);
  var tx=new THREE.CanvasTexture(c);tx.wrapS=tx.wrapT=THREE.RepeatWrapping;tx.repeat.set(rx,ry);return tx;
}
function sandFn(g,w,h){
  g.fillStyle="#e3bf84";g.fillRect(0,0,w,h);
  for(var i=0;i<700;i++){g.fillStyle=i%2?"rgba(255,240,200,.35)":"rgba(120,80,30,.25)";g.fillRect(Math.random()*w,Math.random()*h,1+Math.random()*2,1)}
  g.strokeStyle="rgba(140,100,50,.16)";
  for(i=0;i<6;i++){var y=Math.random()*h;g.beginPath();g.moveTo(0,y);g.bezierCurveTo(w*.3,y+6,w*.6,y-6,w,y);g.stroke()}
}
function trackFn(g,w,h){
  for(var ln=0;ln<3;ln++)for(var r=0;r<2;r++){g.fillStyle=(ln+r)%2?"#dbb277":"#d0a35f";g.fillRect(ln*64,r*64,64,64)}
  g.strokeStyle="rgba(90,55,20,.55)";g.lineWidth=2;
  for(ln=0;ln<3;ln++)for(r=0;r<2;r++)g.strokeRect(ln*64+1,r*64+1,62,62);
  for(var i=0;i<160;i++){g.fillStyle="rgba(90,55,20,.18)";g.fillRect(Math.random()*w,Math.random()*h,2,1)}
}
function brickFn(g,w,h){
  g.fillStyle="#b9915a";g.fillRect(0,0,w,h);g.strokeStyle="rgba(50,25,5,.5)";g.lineWidth=3;
  for(var i=0;i<4;i++){g.beginPath();g.moveTo(0,i*32);g.lineTo(w,i*32);g.stroke();var o=i%2?32:64;g.beginPath();g.moveTo(o,i*32);g.lineTo(o,i*32+32);g.stroke();g.beginPath();g.moveTo(o+64,i*32);g.lineTo(o+64,i*32+32);g.stroke()}
  g.fillStyle="rgba(50,25,5,.5)";g.fillRect(56,14,16,8);g.fillRect(60,26,8,10);g.fillRect(52,40,24,5);
}
function stripeFn(g,w,h){g.fillStyle="#6b4423";g.fillRect(0,0,w,h);g.fillStyle="#e8b83a";for(var i=0;i<4;i++)g.fillRect(i*16+2,0,8,h)}
function near(a,b){return Math.abs(a.r-b.r)+Math.abs(a.g-b.g)+Math.abs(a.b-b.b)<.02}
function paintSky(){
  var g=skyX.createLinearGradient(0,0,0,256);
  g.addColorStop(0,"#"+curA.getHexString());g.addColorStop(.42,"#"+curB.getHexString());g.addColorStop(1,"#"+curB.getHexString());
  skyX.fillStyle=g;skyX.fillRect(0,0,2,256);skyT.needsUpdate=true;
  if(scene.fog)scene.fog.color.copy(curB);
}
function mat(c){return new THREE.MeshLambertMaterial({color:c})}
function mesh(g,m,sx,sy,sz,x,y,z){var o=new THREE.Mesh(g,m);o.scale.set(sx,sy,sz);o.position.set(x,y,z);return o}

function buildWorld(){
  T.sand=mkTex(256,256,sandFn,10,21.67);T.track=mkTex(192,128,trackFn,1,59.1);
  T.brick=mkTex(128,128,brickFn,1,1);T.stripe=mkTex(64,32,stripeFn,1,1);
  G.box=new THREE.BoxGeometry(1,1,1);G.cyl=new THREE.CylinderGeometry(1,1,1,6);G.ico=new THREE.IcosahedronGeometry(1,0);
  G.obel=new THREE.CylinderGeometry(.15,.55,7,4);G.tip=new THREE.ConeGeometry(.2,.7,4);
  G.shadow=new THREE.CircleGeometry(.6,12).rotateX(-Math.PI/2);G.oshadow=new THREE.PlaneGeometry(2.3,1.7).rotateX(-Math.PI/2);
  M.sandsd=mat(0xd9a863);M.wall=new THREE.MeshLambertMaterial({map:T.brick});M.low=mat(0xc4975c);M.post=mat(0x6b4423);
  M.bar=new THREE.MeshLambertMaterial({map:T.stripe});M.curb=mat(0xb3814a);M.cact=mat(0x4f8a3c);M.trunk=mat(0x6b4a2a);M.palm=mat(0x3f8a3a);
  M.col=mat(0xd9b574);M.rock=mat(0xa98048);M.obel=mat(0xc9a063);M.dune=mat(0xe2bd86);
  M.sh=new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.28,depthWrite:false});
  var gp=new THREE.Mesh(new THREE.PlaneGeometry(120,260).rotateX(-Math.PI/2),new THREE.MeshLambertMaterial({map:T.sand}));gp.position.set(0,0,-90);scene.add(gp);
  var tp=new THREE.Mesh(new THREE.PlaneGeometry(6.6,260).rotateX(-Math.PI/2),new THREE.MeshLambertMaterial({map:T.track}));tp.position.set(0,.02,-90);scene.add(tp);
  [-1,1].forEach(function(s){scene.add(mesh(G.box,M.curb,.35,.25,260,s*3.45,.12,-90))});
  [[-35,-150,55,60],[40,-135,40,42],[105,-155,30,30],[-95,-140,25,26]].forEach(function(p){
    var py=new THREE.Mesh(new THREE.ConeGeometry(p[2],p[3],4),M.sandsd);py.rotation.y=Math.PI/4;py.position.set(p[0],p[3]/2,p[1]);scene.add(py);
  });
  [[-70,-95],[75,-100],[0,-170]].forEach(function(p){scene.add(mesh(G.ico,M.dune,45,6,28,p[0],0,p[1]))});
  var sun=new THREE.Mesh(new THREE.SphereGeometry(9,8,6),new THREE.MeshBasicMaterial({color:0xfff3b0,fog:false}));sun.position.set(45,52,-200);scene.add(sun);
  for(var i=0;i<18;i++){
    var d={g:makeDec(i%5),z:-110+i*(124/18)+Math.random()*4,side:i%2?1:-1,off:5+Math.random()*7};
    d.g.position.set(d.side*d.off,0,d.z);scene.add(d.g);decs.push(d);
  }
}
function makeDec(k){
  var g=new THREE.Group();
  if(k===0){
    g.add(mesh(G.cyl,M.cact,.35,3,.35,0,1.5,0));g.add(mesh(G.cyl,M.cact,.18,1.1,.18,-.55,1.7,0));g.add(mesh(G.box,M.cact,.6,.18,.18,-.3,1.15,0));
    g.add(mesh(G.cyl,M.cact,.18,1,.18,.55,2,0));g.add(mesh(G.box,M.cact,.6,.18,.18,.3,1.45,0));
  }else if(k===1){
    g.add(mesh(G.cyl,M.trunk,.22,5,.22,0,2.5,0));g.add(mesh(G.ico,M.palm,1.9,.4,1.9,0,5.1,0));g.add(mesh(G.ico,M.palm,1.2,.35,1.2,.3,5.4,.2));
  }else if(k===2){
    g.add(mesh(G.cyl,M.col,.6,5,.6,0,2.5,0));g.add(mesh(G.box,M.col,1.6,.4,1.6,0,5.2,0));g.add(mesh(G.box,M.col,1.5,.35,1.5,0,.17,0));
  }else if(k===3){
    g.add(mesh(G.ico,M.rock,1.3,.85,1.1,0,.4,0));g.add(mesh(G.ico,M.rock,.7,.5,.6,1.2,.25,.3));
  }else{
    var o=new THREE.Mesh(G.obel,M.obel);o.position.y=3.5;g.add(o);var tp=new THREE.Mesh(G.tip,M.obel);tp.position.y=7.3;g.add(tp);
  }
  return g;
}
function mkObs(ty){
  var g=new THREE.Group();
  if(ty==="w"){g.add(mesh(G.box,M.wall,1.9,2.4,1.2,0,1.2,0));g.add(mesh(G.oshadow,M.sh,1,1,1,-.5,.03,0))}
  else if(ty==="l"){g.add(mesh(G.box,M.low,1.9,.9,1.2,0,.45,0));g.add(mesh(G.oshadow,M.sh,1,1,1,-.4,.03,0))}
  else{g.add(mesh(G.box,M.post,.2,1.7,.3,-.9,.85,0));g.add(mesh(G.box,M.post,.2,1.7,.3,.9,.85,0));g.add(mesh(G.box,M.bar,2.1,.55,.35,0,1.4,0));g.add(mesh(G.oshadow,M.sh,1,1,.25,-.4,.03,0))}
  return g;
}
function getO(ty){var o=pool[ty].pop()||mkObs(ty);scene.add(o);return o}
function freeRow(r){r.c.forEach(function(q){scene.remove(q.m);pool[q.t].push(q.m)})}
function buildPlayer(){
  var top=mat(0xe74c3c),bot=mat(0x2c3e50),shoe=mat(0x1c2833),skin=mat(0xf1c27d),hair=mat(0x3a2a1c);
  var root=new THREE.Group();
  function limb(x,y,mm,w,h,d,hand){var p=new THREE.Group();p.position.set(x,y,0);p.add(mesh(G.box,mm,w,h,d,0,-h/2,0));if(hand)p.add(mesh(G.box,skin,.18,.18,.18,0,-h-.04,0));return p}
  Pl.legL=limb(-.17,.7,bot,.24,.7,.26);Pl.legR=limb(.17,.7,bot,.24,.7,.26);
  Pl.legL.add(mesh(G.box,shoe,.28,.14,.38,0,-.65,-.05));Pl.legR.add(mesh(G.box,shoe,.28,.14,.38,0,-.65,-.05));
  Pl.armL=limb(-.46,1.4,top,.2,.62,.2,true);Pl.armR=limb(.46,1.4,top,.2,.62,.2,true);
  root.add(Pl.legL,Pl.legR,Pl.armL,Pl.armR);
  root.add(mesh(G.box,top,.7,.78,.4,0,1.05,0));root.add(mesh(G.box,skin,.16,.12,.16,0,1.48,0));
  root.add(mesh(G.ico,hair,.27,.27,.27,0,1.68,0));
  var e1=mesh(G.ico,skin,.07,.09,.05,-.26,1.66,0),e2=mesh(G.ico,skin,.07,.09,.05,.26,1.66,0);root.add(e1,e2);
  scene.add(root);Pl.root=root;
  Pl.shadow=new THREE.Mesh(G.shadow,M.sh);Pl.shadow.position.y=.04;scene.add(Pl.shadow);
}
function initGL(){
  if(typeof THREE==="undefined")return false;
  try{R=new THREE.WebGLRenderer({canvas:cv,antialias:false,powerPreference:"low-power"})}catch(e){return false}
  R.setPixelRatio(Math.min(window.devicePixelRatio||1,1));R.setSize(W,H,false);
  scene=new THREE.Scene();cam=new THREE.PerspectiveCamera(62,W/H,.1,260);
  curA=new THREE.Color(SK[0][0]);curB=new THREE.Color(SK[0][1]);tgtA=curA.clone();tgtB=curB.clone();
  var sc=document.createElement("canvas");sc.width=2;sc.height=256;skyX=sc.getContext("2d");skyT=new THREE.CanvasTexture(sc);
  scene.background=skyT;scene.fog=new THREE.Fog(curB.getHex(),45,170);paintSky();
  amb=new THREE.AmbientLight(0xffffff,AMB[0]);scene.add(amb);
  var dl=new THREE.DirectionalLight(0xfff0d0,.85);dl.position.set(-8,14,6);scene.add(dl);
  buildWorld();buildPlayer();
  return true;
}
function setLow(){
  LOW=true;R.setPixelRatio(.7);R.setSize(W,H,false);scene.fog.far=130;
  decs.forEach(function(d,i){if(i%2)d.g.visible=false});
}
addEventListener("resize",function(){W=innerWidth;H=innerHeight;if(R){R.setSize(W,H,false);cam.aspect=W/H;cam.updateProjectionMatrix()}});

/* ===== منطق اللعبة ===== */
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function spawn(){
  var L=lv(),ls=[-1,0,1],r=Math.random(),row=[];
  if(L>=2&&r<Math.min(.4,.08*L)){
    var types=["w","l","b"];ls.forEach(function(l){row.push({l:l,t:pick(types)})});
    if(row.every(function(c){return c.t==="w"}))row[Math.floor(Math.random()*3)].t="l";
  }else{
    var q=Math.random(),pw=.35+Math.min(.2,.03*L),ty,lanes;
    if(q<pw)ty="w";else if(q<pw+(1-pw)/2)ty="l";else ty="b";
    if(ty==="w"){lanes=ls.filter(function(){return Math.random()<.5+.05*Math.min(L,4)});if(!lanes.length)lanes=[pick(ls)];if(lanes.length===3)lanes.pop()}
    else lanes=Math.random()<.5?ls.slice():[pick(ls)];
    lanes.forEach(function(l){row.push({l:l,t:ty})});
  }
  var z=-105;
  row.forEach(function(c){c.m=getO(c.t);c.m.position.set(c.l*LANE,0,z)});
  obs.push({c:row,z:z,pz:z});
}
function start(){
  au();st="play";t=0;dist=0;v=14;lane=0;px=0;jt=-1;sl=-1;buf=null;gap=40;score=0;level=1;banner=0;shake=0;lastScore=-1;lastLevel=0;
  obs.forEach(freeRow);obs=[];
  $("ov").hidden=true;$("hud").hidden=false;
}
function die(){
  st="dead";SFX.hit();shake=1;try{if(navigator.vibrate)navigator.vibrate(90)}catch(e){}
  var nb=score>best;if(nb){best=score;try{localStorage.setItem("dr_best",String(best))}catch(e){}}
  if(window.submitScore)window.submitScore(score);
  setTimeout(function(){
    $("hud").hidden=true;
    $("ot").textContent=nb?"رقم قياسي جديد! 🎉":"خسرت 💥";
    $("os").textContent="نتيجتك: "+score;
    $("ob").textContent="أعلى نتيجة: "+best;
    $("pl").textContent="العب تاني";
    $("ov").hidden=false;
    if(window.lbRefresh)window.lbRefresh();
  },700);
}
function update(dt){
  t+=dt;
  var mv;
  if(st==="play"){
    v=14+Math.min(22,score*.011);mv=v*dt;dist+=mv;
    if(banner>0)banner-=dt;
    px+=(lane-px)*(1-Math.exp(-dt*16));
    if(buf){bufT-=dt;if(bufT<=0)buf=null}
    if(jt>=0){jt+=dt/.72;if(jt>=1){jt=-1;if(buf==="j"){buf=null;jump()}}}
    if(sl>=0){sl+=dt/.62;if(sl>=1){sl=-1;if(buf==="s"){buf=null;slide()}}}
    gap-=mv;if(gap<=0){spawn();gap=v*(Math.max(.62,.95-.04*lv())+Math.random()*.4)}
  }else{mv=(st==="menu"?5:2)*dt;if(shake>0)shake=Math.max(0,shake-dt*2.5)}
  T.sand.offset.y+=mv/12;T.track.offset.y+=mv/4.4;
  for(var i=0;i<decs.length;i++){
    var d=decs[i];d.z+=mv;
    if(d.z>14){d.z=-112-Math.random()*16;d.side=Math.random()<.5?-1:1;d.off=5+Math.random()*7;d.g.position.x=d.side*d.off}
    d.g.position.z=d.z;
  }
  var jy=jt>=0?Math.sin(Math.PI*jt)*2.3:0;
  for(var k=obs.length-1;k>=0;k--){
    var o=obs[k];o.pz=o.z;o.z+=mv;
    for(var j=0;j<o.c.length;j++)o.c[j].m.position.z=o.z;
    if(st==="play"&&Math.min(o.z,o.pz)<1&&Math.max(o.z,o.pz)>-1){
      for(j=0;j<o.c.length;j++){
        var q=o.c[j];
        if(Math.abs(q.l-px)<.4&&(q.t==="w"||(q.t==="l"&&jy<1)||(q.t==="b"&&sl<0))){die();return}
      }
    }
    if(o.z>10){freeRow(o);obs.splice(k,1)}
  }
  if(st==="play"){
    score=Math.floor(dist/1.6);
    var nl=lv();if(nl>level){level=nl;banner=2;SFX.mile()}
    if(score!==lastScore){lastScore=score;$("hs").textContent=score}
    if(level!==lastLevel){lastLevel=level;$("hl").textContent="المستوى "+level}
    var bn=$("bn");if(banner>0){bn.textContent="المستوى "+level+" 🔥";bn.style.opacity=Math.min(1,banner)}else if(bn.style.opacity!=="0")bn.style.opacity="0";
  }
  var stg=(level-1)%4;
  if(stg!==stageNow){stageNow=stg;tgtA.set(SK[stg][0]);tgtB.set(SK[stg][1])}
  if(!near(curA,tgtA)||!near(curB,tgtB)){curA.lerp(tgtA,.04);curB.lerp(tgtB,.04);if(near(curA,tgtA)){curA.copy(tgtA);curB.copy(tgtB)}paintSky()}
  amb.intensity+=(AMB[stg]-amb.intensity)*.05;
}
function animate(){
  var air=jt>=0,jy=air?Math.sin(Math.PI*jt)*2.3:0,run=sl>=0?0:Math.sin(t*14)*(air?.3:1);
  Pl.root.position.set(px*LANE,jy+((air||sl>=0)?0:Math.abs(Math.sin(t*14))*.05),0);
  Pl.root.scale.set(sl>=0?1.1:1,sl>=0?.55:1,sl>=0?1.1:1);
  Pl.root.rotation.z=-(lane-px)*.3;
  Pl.legL.rotation.x=run*.9;Pl.legR.rotation.x=-run*.9;Pl.armL.rotation.x=-run*.8;Pl.armR.rotation.x=run*.8;
  var k=Math.max(.4,1-jy/4);Pl.shadow.position.x=px*LANE;Pl.shadow.scale.set(k,k,k);
  cam.position.set(px*LANE*.55,3.7,6.4);
  if(shake>0){cam.position.x+=(Math.random()-.5)*shake*.6;cam.position.y+=(Math.random()-.5)*shake*.6}
  cam.lookAt(px*LANE*.35,1.4,-10);
  var fv=62+Math.min(12,(v-14)*.5);if(Math.abs(cam.fov-fv)>.1){cam.fov=fv;cam.updateProjectionMatrix()}
}
function loop(ts){
  var raw=(ts-lastTs)/1000;if(raw>0&&raw<.5){ema=ema*.95+raw*.05;if(!LOW&&ema>.034)setLow()}
  var dt=Math.min(.05,raw||0);lastTs=ts;
  update(dt);animate();R.render(scene,cam);requestAnimationFrame(loop);
}

}

</script>

<script type="module">

async function refresh(){
  $("lb").textContent="بتحمّل...";

  try{
    const u=auth.currentUser;if(!u||s<=0)return;

    const old=snap.exists()?snap.data().best:0;

};
