<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f2b366">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Desert Run</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#f2b366;font-family:system-ui,"Segoe UI",Tahoma,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;touch-action:none}
#snd{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:10px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.75);font-size:20px;cursor:pointer;z-index:5}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(40,20,0,.45);z-index:4;padding:8px}
.ov[hidden]{display:none}
.card{background:rgba(255,248,235,.97);color:#3b2a14;border-radius:20px;padding:18px;width:100%;max-width:360px;max-height:94svh;overflow:auto;text-align:center}
h1{margin:0 0 6px;font-size:28px}
.sc{font-size:34px;font-weight:800;min-height:42px}
.bt{color:#7a5a2c;margin-bottom:10px}
.btn{font:inherit;font-size:20px;font-weight:800;border:0;border-radius:14px;padding:12px 28px;background:#c0392b;color:#fff;cursor:pointer;width:100%}
.btn.sm{font-size:14px;font-weight:600;background:#e8d5b0;color:#3b2a14;padding:8px 14px;width:auto}
.sk{display:flex;gap:6px;justify-content:center;margin:8px 0 10px}.sk button{font:inherit;font-size:14px;padding:8px 10px;border:2px solid transparent;border-radius:12px;background:#e8d5b0;color:#3b2a14;cursor:pointer}.sk button[aria-pressed="true"]{border-color:#c0392b;background:#fff}
.how{font-size:13px;color:#7a5a2c;margin:10px 0}
h2{font-size:16px;margin:14px 0 6px}
.lb{font-size:14px;text-align:right;min-height:24px}
.lb div{display:flex;justify-content:space-between;padding:3px 6px;border-bottom:1px solid #e8d5b0}
.lb div:first-child{font-weight:800}
.muted{font-size:13px;color:#7a5a2c;margin:6px 0}
:focus-visible{outline:3px solid #c0392b;outline-offset:2px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="snd" type="button" aria-label="الصوت">🔊</button>
<div class="ov" id="ov">
  <div class="card">
    <h1 id="ot" dir="ltr">Desert Run 🏜️</h1>
    <div class="sc" id="os"></div>
    <div class="bt" id="ob"></div>
    <button class="btn" id="pl" type="button">ابدأ</button>
    <div class="how">اسحب يمين/شمال للتبديل بين المسارات، لفوق للقفز، ولتحت للانزلاق. كل ما تتقدم الجري بيسرع والعوائق بتصعب.</div>
    <h2>🏆 لوحة المتصدرين</h2>
    <div class="lb" id="lb">محتاجة إنترنت.</div>
    <div id="acc"></div>
  </div>
</div>

<script>
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
var cv=$("c"),x=cv.getContext("2d"),W,H,dpr,hY,gY,cx,LS,sb,F=14;
function rs(){dpr=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+"px";cv.style.height=H+"px";x.setTransform(dpr,0,0,dpr,0,0);hY=H*.36;gY=H*.84;cx=W/2;LS=Math.min(W*.3,H*.16);sb=(H-hY)/(gY-hY);vg=null}
addEventListener("resize",rs);rs();

var LOW=false,pts=[],pt=0,ema=.016,vg=null;
var st="menu",t=0,dist=0,v=20,lane=0,px=0,jt=-1,sl=-1,obs=[],dec=[],gap=40,dgap=0,off=0,shake=0,score=0,best=0,mile=0,level=1,banner=0,skin=0,mute=false,lastTs=0;
try{best=+localStorage.getItem("dr_best")||0;mute=localStorage.getItem("dr_mute")==="1"}catch(e){}
var SK=[["#5bb3e6","#fde4b8"],["#f39c4a","#fde0a8"],["#7b5ea7","#f7b2a0"],["#12214a","#4a4a8a"]];
var SKINS=[{top:"#e74c3c",bot:"#2c3e50",shoe:"#1c2833",skin:"#f1c27d"}];
function lv(){return 1+Math.floor(score/250)}

/* الصوت */
var AC=null;
function au(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==="suspended")AC.resume()}
function tone(f1,f2,d,ty,vol){
  if(mute||!AC)return;
  var o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;
  o.type=ty;o.frequency.setValueAtTime(f1,n);o.frequency.exponentialRampToValueAtTime(f2,n+d);
  g.gain.setValueAtTime(vol,n);g.gain.exponentialRampToValueAtTime(.001,n+d);
  o.connect(g);g.connect(AC.destination);o.start();o.stop(n+d);
}
var SFX={
  jump:function(){tone(380,760,.14,"square",.07)},
  slide:function(){tone(320,120,.2,"triangle",.12)},
  move:function(){tone(520,470,.05,"sine",.07)},
  hit:function(){tone(220,40,.45,"sawtooth",.16)},
  mile:function(){tone(660,990,.12,"square",.06);setTimeout(function(){tone(990,1320,.15,"square",.06)},110)}
};
function sndIcon(){$("snd").textContent=mute?"🔇":"🔊"}
$("snd").onclick=function(e){e.stopPropagation();mute=!mute;try{localStorage.setItem("dr_mute",mute?"1":"0")}catch(er){}sndIcon();au()};
sndIcon();

/* التحكم */
function go(d){if(st!=="play")return;var n=Math.max(-1,Math.min(1,lane+d));if(n!==lane){lane=n;SFX.move()}}
function jump(){if(st!=="play")return;if(jt>=0){buf="j";bufT=.18;return}sl=-1;jt=0;SFX.jump()}
function slide(){if(st!=="play")return;if(sl>=0){buf="s";bufT=.18;return}jt=-1;sl=0;SFX.slide()}
var sx=0,sy=0,lastAct=0,buf=null,bufT=0;
cv.addEventListener("touchstart",function(e){var p=e.touches[0];sx=p.clientX;sy=p.clientY},{passive:true});
cv.addEventListener("touchmove",function(e){
  e.preventDefault();
  if(st!=="play")return;
  var p=e.touches[0],dx=p.clientX-sx,dy=p.clientY-sy,n=Date.now();
  if(Math.abs(dx)<18&&Math.abs(dy)<18)return;
  if(n-lastAct<110)return;
  lastAct=n;sx=p.clientX;sy=p.clientY;
  if(Math.abs(dx)>Math.abs(dy))go(dx>0?1:-1);else if(dy<0)jump();else slide();
},{passive:false});
document.addEventListener("keydown",function(e){
  var k=e.key;
  if(k==="ArrowLeft")go(-1);else if(k==="ArrowRight")go(1);
  else if(k==="ArrowUp"||k===" ")jump();else if(k==="ArrowDown")slide();
  else if(k==="Enter"&&st!=="play")start();
});

/* منطق اللعبة */
function spawn(){
  var L=lv(),ls=[-1,0,1],r=Math.random(),row=[];
  function pick(a){return a[Math.floor(Math.random()*a.length)]}
  if(L>=2&&r<Math.min(.4,.08*L)){
    var types=["w","l","b"];
    ls.forEach(function(l){row.push({l:l,t:pick(types)})});
    if(row.every(function(c){return c.t==="w"}))row[Math.floor(Math.random()*3)].t="l";
  }else{
    var q=Math.random(),pw=.35+Math.min(.2,.03*L),ty,lanes;
    if(q<pw)ty="w";else if(q<pw+(1-pw)/2)ty="l";else ty="b";
    if(ty==="w"){lanes=ls.filter(function(){return Math.random()<.5+.05*Math.min(L,4)});if(!lanes.length)lanes=[pick(ls)];if(lanes.length===3)lanes.pop()}
    else lanes=Math.random()<.5?ls.slice():[pick(ls)];
    lanes.forEach(function(l){row.push({l:l,t:ty})});
  }
  obs.push({c:row,d:85,pd:85});
}
function spawnDec(){dec.push({k:Math.floor(Math.random()*5),side:Math.random()<.5?-1:1,off:2.2+Math.random()*2.2,d:88})}
function start(){
  au();st="play";t=0;dist=0;v=20;lane=0;px=0;jt=-1;sl=-1;obs=[];pts=[];buf=null;gap=45;score=0;mile=0;level=1;banner=0;shake=0;
  $("ov").hidden=true;
}
function die(){
  st="dead";SFX.hit();shake=1;try{if(navigator.vibrate)navigator.vibrate(90)}catch(e){}
  var nb=score>best;if(nb){best=score;try{localStorage.setItem("dr_best",String(best))}catch(e){}}
  if(window.submitScore)window.submitScore(score);
  setTimeout(function(){
    $("ot").textContent=nb?"رقم قياسي جديد! 🎉":"خسرت 💥";
    $("os").textContent="نتيجتك: "+score;
    $("ob").textContent="أعلى نتيجة: "+best;
    $("pl").textContent="العب تاني";
    $("ov").hidden=false;
    if(window.lbRefresh)window.lbRefresh();
  },700);
}
function update(dt){
  if(st==="menu"||st==="dead"){
    var m0=(st==="menu"?14:6)*dt;off+=m0;dgap-=m0;
    if(dgap<=0){spawnDec();dgap=5+Math.random()*5}
    dec.forEach(function(o){o.d-=m0});dec=dec.filter(function(o){return o.d>-10});
    if(shake>0)shake=Math.max(0,shake-dt*2.5);
    t+=dt;return;
  }
  t+=dt;v=20+Math.min(42,score*.02);if(banner>0)banner-=dt;
  var mv=v*dt;dist+=mv;off+=mv;
  px+=(lane-px)*(1-Math.exp(-dt*16));
  if(!LOW){pt+=dt;if(pt>.05&&jt<0){pt=0;pts.push({x:cx+px*LS+(Math.random()-.5)*LS*.2,y:gY,vx:(Math.random()-.5)*60,vy:-30-Math.random()*60,life:.5})}}
  for(var u=pts.length-1;u>=0;u--){var pp=pts[u];pp.x+=pp.vx*dt;pp.y+=pp.vy*dt;pp.vy+=260*dt;pp.life-=dt;if(pp.life<=0)pts.splice(u,1)}
  if(buf){bufT-=dt;if(bufT<=0)buf=null}
  if(jt>=0){jt+=dt/.72;if(jt>=1){jt=-1;if(buf==="j"){buf=null;jump()}}}
  if(sl>=0){sl+=dt/.62;if(sl>=1){sl=-1;if(buf==="s"){buf=null;slide()}}}
  gap-=mv;if(gap<=0){spawn();gap=v*(Math.max(.62,.95-.04*lv())+Math.random()*.4)}
  dgap-=mv;if(dgap<=0){spawnDec();dgap=5+Math.random()*5}
  obs.forEach(function(o){o.pd=o.d;o.d-=mv});dec.forEach(function(o){o.d-=mv});
  obs=obs.filter(function(o){return o.d>-8});dec=dec.filter(function(o){return o.d>-10});
  var jh=jt>=0?Math.sin(Math.PI*jt):0;
  for(var i=0;i<obs.length;i++){
    var o=obs[i];
    if(o.d<.9&&o.pd>-.9){
      for(var j=0;j<o.c.length;j++){
        var q=o.c[j];
        if(Math.abs(q.l-px)<.4){
          if(q.t==="w"||(q.t==="l"&&jh<.45)||(q.t==="b"&&sl<0)){die();return}
        }
      }
    }
  }
  score=Math.floor(dist/3);
  var nl=lv();if(nl>level){level=nl;banner=2;SFX.mile()}
}

/* الرسم */
function rr(a,b,w,h,r){x.beginPath();if(x.roundRect)x.roundRect(a,b,w,h,r);else x.rect(a,b,w,h);x.fill()}
function hash(n){n=Math.sin(n*127.1)*43758.5453;return n-Math.floor(n)}
function poly(p,f){x.fillStyle=f;x.beginPath();x.moveTo(p[0][0],p[0][1]);for(var i=1;i<p.length;i++)x.lineTo(p[i][0],p[i][1]);x.closePath();x.fill()}
function shade(hx,k){var n=parseInt(hx.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;function m(c){return Math.max(0,Math.min(255,Math.round(k<0?c*(1+k):c+(255-c)*k)))}return"rgb("+m(r)+","+m(g)+","+m(b)+")"}
function hexA(hx,a){var n=parseInt(hx.slice(1),16);return"rgba("+(n>>16)+","+(n>>8&255)+","+(n&255)+","+a+")"}
function box(xc,wd,z0,z1,d,dep,col,tex){
  var s1=F/(F+d),s2=F/(F+d+dep),y1=hY+(gY-hY)*s1,y2=hY+(gY-hY)*s2;
  var l1=cx+(xc-wd/2)*LS*s1,r1=cx+(xc+wd/2)*LS*s1,l2=cx+(xc-wd/2)*LS*s2,r2=cx+(xc+wd/2)*LS*s2;
  var b1=y1-z0*LS*s1,b2=y2-z0*LS*s2,t1=y1-z1*LS*s1,t2=y2-z1*LS*s2;
  if(z0===0){var o1=LS*.5*s1,o2=LS*.5*s2;poly([[l1-o1,y1+2],[r1,y1+2],[r2,y2+1],[l2-o2,y2+1]],"rgba(60,35,10,.3)")}
  if(xc<-.05)poly([[r1,b1],[r2,b2],[r2,t2],[r1,t1]],shade(col,-.3));
  else if(xc>.05)poly([[l1,b1],[l2,b2],[l2,t2],[l1,t1]],shade(col,-.3));
  poly([[l1,t1],[r1,t1],[r2,t2],[l2,t2]],shade(col,.28));
  var g=x.createLinearGradient(0,t1,0,b1);g.addColorStop(0,shade(col,.1));g.addColorStop(1,shade(col,-.14));
  x.fillStyle=g;x.fillRect(l1,t1,r1-l1,b1-t1);
  if(tex)tex(l1,t1,r1-l1,b1-t1,s1);
  x.strokeStyle="rgba(40,20,0,.45)";x.lineWidth=Math.max(1,1.5*s1);x.strokeRect(l1,t1,r1-l1,b1-t1);
}
function brickTex(l,t,w,h,s){
  x.strokeStyle="rgba(50,25,5,.38)";x.lineWidth=Math.max(1,s*1.5);x.beginPath();
  for(var i=1;i<4;i++){x.moveTo(l,t+h*i/4);x.lineTo(l+w,t+h*i/4)}
  for(i=0;i<4;i++){var yy=t+h*i/4,of=i%2?w*.25:w*.6;x.moveTo(l+of,yy);x.lineTo(l+of,yy+h/4)}
  x.stroke();x.fillStyle="rgba(50,25,5,.4)";x.fillRect(l+w*.4,t+h*.1,w*.2,h*.1);x.fillRect(l+w*.46,t+h*.22,w*.08,h*.12);
}
function bandTex(l,t,w,h,s){x.fillStyle="rgba(50,25,5,.28)";x.fillRect(l,t+h*.5,w,Math.max(1,s*2));x.fillStyle="rgba(255,235,190,.25)";x.fillRect(l+w*.08,t+h*.12,w*.84,Math.max(1,s*2))}
function stripeTex(l,t,w,h,s){x.fillStyle="#e8b83a";var n=6,sw=w/n/1.6;for(var i=0;i<n;i++)x.fillRect(l+w*i/n+sw*.3,t,sw,h)}
function drawObs(o){
  o.c.forEach(function(q){
    var l=q.l;
    if(q.t==="w")box(l,.86,0,1.15,o.d,1,"#b9915a",brickTex);
    else if(q.t==="l")box(l,.86,0,.42,o.d,1,"#c4975c",bandTex);
    else{box(l-.4,.1,0,.82,o.d,.3,"#6b4423");box(l+.4,.1,0,.82,o.d,.3,"#6b4423");box(l,.9,.5,.78,o.d,.3,"#8d5a2b",stripeTex)}
  });
}
function pyr(c,w,h){
  var a=x.createLinearGradient(c-w/2,0,c,0);a.addColorStop(0,"#ecc482");a.addColorStop(1,"#d3a262");
  poly([[c-w/2,hY+2],[c,hY-h],[c,hY+2]],a);
  var b=x.createLinearGradient(c,0,c+w/2,0);b.addColorStop(0,"#b5844a");b.addColorStop(1,"#8f6334");
  poly([[c,hY-h],[c+w/2,hY+2],[c,hY+2]],b);
  x.strokeStyle="rgba(110,70,25,.22)";x.lineWidth=1;x.beginPath();
  for(var i=1;i<7;i++){var f=i/7,yy=hY-h*f;x.moveTo(c-(w/2)*(1-f),yy);x.lineTo(c+(w/2)*(1-f),yy)}
  x.stroke();
}
function drawDec(o,s,y){
  var xx=cx+o.side*o.off*LS*s,u=LS*s,g;
  x.fillStyle="rgba(60,35,10,.25)";x.beginPath();x.ellipse(xx-u*.15,y+u*.02,u*.38,u*.09,0,0,7);x.fill();
  if(o.k===0){
    g=x.createLinearGradient(xx-u*.1,0,xx+u*.1,0);g.addColorStop(0,"#6aa84f");g.addColorStop(1,"#3d7a30");x.fillStyle=g;
    rr(xx-u*.1,y-u*1.25,u*.2,u*1.25,u*.1);rr(xx-u*.34,y-u*.85,u*.15,u*.42,u*.075);rr(xx-u*.34,y-u*.5,u*.3,u*.14,u*.06);
    rr(xx+u*.19,y-u*.98,u*.15,u*.42,u*.075);rr(xx+u*.02,y-u*.6,u*.3,u*.14,u*.06);
  }else if(o.k===1){
    poly([[xx-u*.15,y],[xx-u*.1,y-u*1.8],[xx,y-u*2.15],[xx,y]],"#d6ae6e");
    poly([[xx,y],[xx,y-u*2.15],[xx+u*.1,y-u*1.8],[xx+u*.15,y]],"#a98048");
    x.fillStyle="rgba(70,40,10,.35)";for(var i=1;i<6;i++)x.fillRect(xx-u*.05,y-u*.3*i,u*.1,Math.max(1,u*.04));
  }else if(o.k===2){
    g=x.createLinearGradient(0,y-u*.4,0,y);g.addColorStop(0,"#d1a870");g.addColorStop(1,"#9c7340");x.fillStyle=g;
    x.beginPath();x.ellipse(xx,y-u*.16,u*.34,u*.22,0,0,7);x.fill();
  }else if(o.k===3){
    x.strokeStyle="#6b4a2a";x.lineWidth=u*.1;x.lineCap="round";x.beginPath();x.moveTo(xx,y);x.quadraticCurveTo(xx+u*.2,y-u*1.1,xx+u*.05,y-u*2);x.stroke();
    var tx=xx+u*.05,ty=y-u*2;x.fillStyle="#3f8a3a";
    for(var j=0;j<6;j++){var an=j*Math.PI/3+.3;x.beginPath();x.moveTo(tx,ty);x.quadraticCurveTo(tx+Math.cos(an)*u*.5,ty+Math.sin(an)*u*.25-u*.35,tx+Math.cos(an)*u*.85,ty+Math.sin(an)*u*.5);x.quadraticCurveTo(tx+Math.cos(an)*u*.5,ty+Math.sin(an)*u*.2-u*.12,tx,ty);x.fill()}
  }else{
    g=x.createLinearGradient(xx-u*.2,0,xx+u*.2,0);g.addColorStop(0,"#e2bd80");g.addColorStop(1,"#a67c46");x.fillStyle=g;
    x.fillRect(xx-u*.2,y-u*1.5,u*.4,u*1.5);x.fillRect(xx-u*.3,y-u*1.6,u*.6,u*.14);x.fillRect(xx-u*.28,y-u*.1,u*.56,u*.1);
    x.fillStyle="rgba(70,40,10,.25)";for(var k=1;k<4;k++)x.fillRect(xx-u*.2+u*.1*k,y-u*1.45,Math.max(1,u*.02),u*1.3);
  }
}
function limb(a,b,c,col,w){
  x.lineCap="round";x.lineJoin="round";x.strokeStyle="#12100d";x.lineWidth=w+Math.max(2,LS*.035);
  x.beginPath();x.moveTo(a[0],a[1]);x.quadraticCurveTo(b[0],b[1],c[0],c[1]);x.stroke();
  x.strokeStyle=col;x.lineWidth=w;x.stroke();
}
function drawPlayer(){
  var K=SKINS[0],ph=LS*.95,jh=jt>=0?Math.sin(Math.PI*jt)*LS*.95:0,X=cx+px*LS,Y=gY-jh;
  x.save();x.translate(X,gY+4);x.scale(1-jh/(LS*2.4),.28);
  var sg=x.createRadialGradient(0,0,0,0,0,LS*.34);sg.addColorStop(0,"rgba(30,15,0,.5)");sg.addColorStop(1,"rgba(30,15,0,0)");
  x.fillStyle=sg;x.beginPath();x.arc(0,0,LS*.34,0,7);x.fill();x.restore();
  var run=sl>=0?0:Math.sin(t*14)*(jt>=0?.3:1),bob=jt>=0||sl>=0?0:Math.abs(Math.sin(t*14))*LS*.025;
  x.save();x.translate(X,Y-bob);x.rotate((lane-px)*.22);if(sl>=0)x.scale(1.12,.55);
  var hip1=[-LS*.07,-ph*.4],hip2=[LS*.07,-ph*.4];
  var f1=[run*LS*.16,-Math.max(0,-run)*LS*.15],f2=[-run*LS*.16,-Math.max(0,run)*LS*.15];
  limb(hip1,[hip1[0]-LS*.05+f1[0]*.5,(hip1[1]+f1[1])/2],f1,K.bot,LS*.12);
  limb(hip2,[hip2[0]+LS*.05+f2[0]*.5,(hip2[1]+f2[1])/2],f2,K.bot,LS*.12);
  [f1,f2].forEach(function(f){x.fillStyle=K.shoe;x.strokeStyle="#0b0f13";x.lineWidth=1.5;x.beginPath();x.ellipse(f[0],f[1]-LS*.025,LS*.115,LS*.06,0,0,7);x.fill();x.stroke();x.fillStyle="rgba(255,255,255,.15)";x.fillRect(f[0]-LS*.07,f[1]-LS*.06,LS*.1,LS*.02)});
